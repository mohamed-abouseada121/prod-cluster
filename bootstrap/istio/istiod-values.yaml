# ==============================================================================
# Istio Control Plane (istiod) Production Values
# ==============================================================================
global:
  hub: registry.istio.io/release
  tag: 1.30.3
  istioNamespace: istio-system

pilot:
  autoscaleEnabled: true
  autoscaleMin: 2
  autoscaleMax: 5
  replicaCount: 2
  rollingMaxSurge: 100%
  rollingMaxUnavailable: 25%

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

  nodeSelector:
    node-role.kubernetes.io/worker: worker

  tolerations:
    - key: cni.istio.io/not-ready
      operator: Exists

  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - istiod
          topologyKey: kubernetes.io/hostname
