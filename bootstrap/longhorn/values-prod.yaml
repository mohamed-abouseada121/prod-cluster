# ==============================================================================
# Longhorn Production Values (HA 3-Way Storage Engine)
# ==============================================================================
global:
  nodeSelector:
    node-role.kubernetes.io/worker: worker

preUpgradeChecker:
  jobEnabled: false

persistence:
  defaultClass: true
  defaultFsType: ext4
  defaultClassReplicaCount: 3
  defaultDataLocality: disabled
  reclaimPolicy: Delete

defaultSettings:
  defaultReplicaCount: 3
  replicaAutoBalance: best-effort
  storageOverProvisioningPercentage: 200
  storageMinimalAvailablePercentage: 15
  upgradeChecker: false
  defaultDataPath: /var/lib/longhorn
  replicaSoftAntiAffinity: false
  replicaDiskSoftAntiAffinity: false
  autoSalvage: true
  disableRevisionCounter: true
  systemManagedPodsImagePullPolicy: IfNotPresent
  allowVolumeCreationWithDegradedAvailability: false
  autoCleanupSystemGeneratedSnapshot: true

longhornManager:
  log:
    level: INFO
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  nodeSelector:
    node-role.kubernetes.io/worker: worker

longhornDriver:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

longhornUI:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - longhorn-ui
            topologyKey: kubernetes.io/hostname
