# ==============================================================================
# Wildcard Certificates: *.obelion.ai and *.syntera.ai (istio-system)
# ==============================================================================
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: obelion-ai-wildcard
  namespace: istio-system
spec:
  dnsNames:
    - '*.obelion.ai'
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-cloudflare
  secretName: obelion-ai-wildcard-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: syntera-ai-wildcard-cert
  namespace: istio-system
spec:
  dnsNames:
    - '*.syntera.ai'
    - syntera.ai
  issuerRef:
    kind: ClusterIssuer
    name: syntera-dns-issuer
  secretName: syntera-ai-wildcard-tls
