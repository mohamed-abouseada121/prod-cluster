# ==============================================================================
# Cloudflare API Tokens for Let's Encrypt DNS-01 Solvers (EXAMPLE)
# DO NOT COMMIT REAL TOKENS HERE. Apply secrets securely via Vault / SealedSecrets
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "YOUR_CLOUDFLARE_API_TOKEN_FOR_OBELION"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token-syntera
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "YOUR_CLOUDFLARE_API_TOKEN_FOR_SYNTERA"
