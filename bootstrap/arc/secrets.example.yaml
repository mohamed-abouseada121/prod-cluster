# ==============================================================================
# GitHub Token Secret for ARC Runners (EXAMPLE)
# DO NOT COMMIT REAL TOKENS HERE. Apply secrets securely via Vault / kubectl
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: arc-github-secret
  namespace: arc-runners
type: Opaque
stringData:
  github_token: "YOUR_GITHUB_PAT_OR_APP_TOKEN"
