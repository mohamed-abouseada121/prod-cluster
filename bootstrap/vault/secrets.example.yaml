schema:
  secret/bayan/secrets:
    CLICKHOUSE_PASSWORD: "example_password"
    POSTGRES_PASSWORD: "example_password"
    LANGFUSE_DATABASE_URL: "postgresql://..."
  secret/swe-syntera/secrets:
    DATABASE_URL: "postgresql://..."
    POSTGRES_PASSWORD: "example_password"
    MONGO_INITDB_ROOT_PASSWORD: "example_password"
    KEYCLOAK_CLIENT_SECRET: "example_secret"
    LANGSMITH_API_KEY: "example_key"
  syntera/secrets:
    SYNTERA_TOKEN: "example_token"
