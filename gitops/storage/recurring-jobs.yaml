apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: hourly-snapshot
  namespace: longhorn-system
spec:
  name: hourly-snapshot
  task: snapshot
  cron: "0 * * * *"
  retain: 12
  concurrency: 2
  groups:
  - default
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-s3-backup
  namespace: longhorn-system
spec:
  name: daily-s3-backup
  task: backup
  cron: "0 4 * * *"
  retain: 7
  concurrency: 2
  groups:
  - default
