apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: syntera-db
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/mohamed-abouseada121/prod-cluster.git'
    targetRevision: main
    path: gitops/syntera-db
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: syntera-db
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /status
    - group: postgresql.cnpg.io
      kind: Pooler
      jsonPointers:
        - /status
